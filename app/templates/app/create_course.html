{% extends "app/base_instructor.html" %}

{% block title %}
Tạo khóa học - PTIT214
{% endblock title %}

{% block instructor_content %}

<div class="container-fluid py-4">

    <div class="d-flex justify-content-between align-items-center mb-4">

        <div>
            <h3 class="fw-bold mb-1">
                Tạo khóa học
            </h3>

            <p class="text-muted mb-0">
                Tạo khóa học mới cho học viên.
            </p>
        </div>

        <a href="{% url 'teacher_courses' %}"
           class="btn btn-light border rounded-3">

            <i class="bi bi-arrow-left me-1"></i>
            Quay lại

        </a>

    </div>


    <div class="card border-0 shadow-sm rounded-4">

        <div class="card-body p-4">

            <form method="POST"
                  enctype="multipart/form-data">

                {% csrf_token %}

                <!-- TÊN KHÓA HỌC -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Tên khóa học
                    </label>

                    <input
                        type="text"
                        name="title"
                        class="form-control form-control-lg"
                        placeholder="Ví dụ: Lập trình Python cơ bản"
                        required
                    >

                </div>


                <!-- MÔ TẢ -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Mô tả khóa học
                    </label>

                    <textarea
                        name="description"
                        rows="6"
                        class="form-control"
                        placeholder="Nhập mô tả chi tiết về khóa học..."
                        required
                    ></textarea>

                </div>


                <!-- ẢNH -->

                <div class="mb-4">

                    <label class="form-label fw-semibold">
                        Ảnh khóa học
                    </label>

                    <input
                        type="file"
                        name="thumbnail"
                        class="form-control"
                        accept="image/*"
                    >

                    <div class="form-text">
                        Nên sử dụng ảnh có tỷ lệ 16:9.
                    </div>

                </div>


                <!-- NÚT -->

                <div class="d-flex justify-content-end gap-2">

                    <a
                        href="{% url 'teacher_courses' %}"
                        class="btn btn-light border rounded-3 px-4"
                    >
                        Hủy
                    </a>

                    <button
                        type="submit"
                        class="btn btn-primary rounded-3 px-4"
                    >

                        <i class="bi bi-plus-circle me-1"></i>

                        Tạo khóa học

                    </button>

                </div>

            </form>

        </div>

    </div>

</div>

{% endblock instructor_content %}
